Ihre Anmeldungen aus tailnet-proxy, der früheren Version dieser App, konnten nicht übernommen werden ({ $error }). Wahrscheinlich läuft tailnet-proxy noch. Beenden Sie tailnet-proxy und starten Sie { -app-name } dann neu, bevor Sie sich hier anmelden: Eine erneute Anmeldung würde diesen Computer jedem Tailnet ein zweites Mal hinzufügen.

