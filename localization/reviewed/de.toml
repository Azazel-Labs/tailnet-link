[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "„Ein“ setzt die Proxy-Einstellung von GNOME oder KDE, solange die App läuft und weiterleitet, und stellt sie danach wieder her. Aktivieren Sie in Firefox Einstellungen > Netzwerk-Einstellungen > „Proxy-Einstellungen des Systems verwenden“."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "„Ein“ setzt den Proxy für Ihre Netzwerkdienste, solange die App läuft, und stellt ihn danach wieder her. Wenn Ihr Mac dafür ein Administratorpasswort verlangt, werden Sie beim Start des Routings und beim Beenden danach gefragt."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "„Ein“ richtet Windows nur auf die Regeln dieser App aus, solange sie läuft und weiterleitet, und stellt alles wieder her, wenn sie beendet, pausiert, getrennt wird oder abstürzt."

