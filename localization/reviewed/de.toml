[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Für Apps, die die Proxy-Einstellung ignorieren, wie Remotedesktop, SSH und Datenbankclients. Jede Weiterleitung ist ein Port auf diesem Computer, der zu einem Gerät in einem Tailnet führt."

