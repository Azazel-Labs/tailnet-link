[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } este rutat prin { $tailnet }, dar conectarea la portul { $port } a eșuat: { $error }
    Verifică dacă mașina este online și dacă ceva ascultă pe acel port."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Acel tailnet tocmai a dispărut."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } nu este rutat de { -app-name }: nu se termină cu domeniul niciunui tailnet care rutează acum, așa că merge direct (prin rețeaua obișnuită și prin propriul Tailscale).

# reference -app-name
Tailnet Link"""

