source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Acum nu trece nimic prin alte tailneturi. Rețeaua și tailnetul tău funcționează ca de obicei."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Browserul nu va deschide adresele din aceste tailneturi: altceva a modificat setarea proxy a sistemului."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Browserul nu va deschide adresele din aceste tailneturi: setarea proxy a sistemului nu a putut fi modificată ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "Setarea proxy a sistemului este dezactivată, așa că doar aplicațiile pe care le configurezi singur ajung la aceste tailneturi. Îndreaptă-le spre { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Browserul nu va deschide adresele din aceste tailneturi: altă copie de { -app-name } deține setarea proxy a sistemului. Închide copia aceea și aceasta va prelua controlul.

# reference -app-name
Tailnet Link"""

