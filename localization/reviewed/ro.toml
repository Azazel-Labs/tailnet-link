[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Autentificările tale din tailnet-proxy, versiunea anterioară a acestei aplicații, nu au putut fi mutate ({ $error }). Probabil încă rulează. Închide tailnet-proxy, apoi pornește din nou { -app-name } înainte să te autentifici aici: o nouă autentificare ar adăuga acest computer a doua oară în fiecare tailnet.

# reference -app-name
Tailnet Link"""

