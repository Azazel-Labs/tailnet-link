[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "„Activat” modifică setarea proxy din GNOME sau KDE cât timp aplicația rulează și rutează, apoi o restabilește. În Firefox, activează Setări > Setări de rețea > „Folosește setările proxy ale sistemului”."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "„Activat” setează proxyul pentru serviciile de rețea cât timp aplicația rulează și îl restabilește după aceea. Dacă Mac-ul cere o parolă de administrator pentru asta, ți se va cere când pornește rutarea și când închizi aplicația."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "„Activat” îndreaptă Windows spre regulile acestei aplicații doar cât timp rulează și rutează, apoi restabilește totul când se oprește, este întreruptă, se deconectează sau se blochează."

