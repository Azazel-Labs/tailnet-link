[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "A „Be” az alkalmazás futása és útválasztása alatt beállítja a GNOME vagy a KDE proxybeállítását, utána pedig visszaállítja. A Firefoxban kapcsolja be ezt: Beállítások > Hálózati beállítások > „Rendszerbeállítások használata”."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "A „Be” az alkalmazás futása alatt beállítja a proxyt a hálózati szolgáltatásokhoz, utána pedig visszaállítja. Ha a Mac ehhez rendszergazdai jelszót kér, az útválasztás indításakor és kilépéskor kell megadnia."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "A „Be” csak akkor irányítja a Windowst az alkalmazás szabályaira, amikor az fut és útválasztást végez, és mindent visszaállít, amikor leáll, szünetel, megszakad a kapcsolata vagy összeomlik."

