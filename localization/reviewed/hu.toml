translation = "{ $address } működik: kapcsolódva a(z) { $tailnet } tailneten át, { $ms } ms alatt."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "{ $host } a(z) { $tailnet } tailneten át van irányítva, de a(z) { $port } port 10 másodpercen belül nem válaszolt."

