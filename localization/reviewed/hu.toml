[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Soronként egy: LOCALPORT = host:port, vagy auto = host:port, ha a program válasszon szabad portot. A gép neve dönti el, melyik tailnet viszi a forgalmat. Gyors hozzáadáshoz használja a csatlakozó gombot egy gép mellett a Tailnetek lapon."

[messages.forwards-heading]
source = "Port forwards"
translation = "Porttovábbítások"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "A proxybeállítást figyelmen kívül hagyó alkalmazásokhoz, például a Távoli asztalhoz, az SSH- és az adatbázis-kliensekhez. Minden továbbítás egy port ezen a számítógépen, amely egy tailnet egyik gépéhez vezet."

