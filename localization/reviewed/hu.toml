translation = "Írjon be egy gépnevet vagy webcímet."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } a(z) { $tailnet } tailneten át van irányítva, de a(z) { $port } portra nem sikerült csatlakozni: { $error }
    Ellenőrizze, hogy a gép online van-e, és figyel-e valami azon a porton."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Ez a tailnet épp eltűnt."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host }: a { -app-name } nem irányítja át, mert egyik éppen útválasztást végző tailnet tartományára sem végződik. Ezért közvetlenül halad (a szokásos hálózatán és a saját Tailscale-kapcsolatán át).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "A(z) { $tailnet } tailnet nem fut."

[messages.check-ok]
