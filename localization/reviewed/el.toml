[messages.log-out-text]
source = "Log out of { $tailnet }? Its addresses stop working here until you sign in again."
translation = "Αποσύνδεση από το { $tailnet }; Οι διευθύνσεις του σταματούν να λειτουργούν εδώ μέχρι να συνδεθείτε ξανά."

[messages.log-out-title]
source = "Log out?"
