[messages.about-line]
source = """
{ -app-name } { $version } · local proxy { $proxy } · PAC { $pac }

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } { $version } · τοπικός διακομιστής μεσολάβησης { $proxy } · PAC { $pac }

# reference -app-name
Tailnet Link"""

[messages.add-forward]
source = "Add forward"
translation = "Προσθήκη προώθησης"

[messages.add-forward-failed]
source = """
Couldn't add the port forward:
    { $error }"""
translation = """
Δεν ήταν δυνατή η προσθήκη της προώθησης θύρας:
    { $error }"""

[messages.add-tailnet]
source = "Add a tailnet"
translation = "Προσθήκη tailnet"

[messages.add-tailnet-failed]
source = """
Couldn't add a tailnet:
    { $error }"""
translation = """
Δεν ήταν δυνατή η προσθήκη tailnet:
    { $error }"""

[messages.afrikaans]
source = "Afrikaans"
translation = "Αφρικάανς"

[messages.autostart-unsupported]
source = "Starting at login isn't supported on this system."
translation = "Η εκκίνηση κατά τη σύνδεση δεν υποστηρίζεται σε αυτό το σύστημα."

[messages.cancel]
source = "Cancel"
translation = "Ακύρωση"

[messages.catalan]
source = "Catalan"
translation = "Καταλανικά"

[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "Το { $host } βρίσκεται σε περισσότερα από ένα tailnet ({ $tailnets }), οπότε δεν δρομολογείται. Χρησιμοποιήστε καλύτερα το όνομα του μηχανήματος ή απενεργοποιήστε τα υποδίκτυα για ένα από αυτά τα tailnet."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: δεν είναι έγκυρη θύρα."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Πληκτρολογήστε ένα όνομα μηχανήματος ή μια διεύθυνση web."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
Το { $host } δρομολογείται μέσω { $tailnet }, αλλά η σύνδεση στη θύρα { $port } απέτυχε: { $error }
    Ελέγξτε ότι το μηχάνημα είναι συνδεδεμένο και ότι κάτι ακούει σε αυτή τη θύρα."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Αυτό το tailnet μόλις εξαφανίστηκε."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
Το { $host } δεν δρομολογείται από το { -app-name }: δεν είναι όνομα, διεύθυνση ή υποδίκτυο κανενός tailnet που δρομολογεί αυτή τη στιγμή, οπότε πηγαίνει απευθείας (μέσω του κανονικού σας δικτύου και του δικού σας Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "Το { $tailnet } δεν εκτελείται."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "Το { $address } λειτουργεί: συνδέθηκε μέσω { $tailnet } σε { $ms } ms."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "Το { $host } δρομολογείται μέσω { $tailnet }, αλλά η θύρα { $port } δεν απάντησε μέσα σε 10 δευτερόλεπτα."

[messages.check-updates]
source = "Check for new versions"
translation = "Έλεγχος για νέες εκδόσεις"

