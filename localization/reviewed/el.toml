translation = "Το «{ $value }» δεν είναι αριθμός θύρας (1-65535)."

[messages.not-routing-tooltip]
source = "This tailnet isn't routing right now. Is it paused?"
translation = "Αυτό το tailnet δεν δρομολογεί αυτή τη στιγμή. Μήπως είναι σε παύση;"

[messages.ok]
source = "OK"
translation = "OK"

[messages.open-in-browser]
