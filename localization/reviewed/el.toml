translation = "Το «{ $domain }» περιέχει χαρακτήρες που δεν επιτρέπονται σε τομέα."

[messages.domain-conflict]
source = "{ $domain } is also routed by { $tailnet }; that one wins."
translation = "Το { $domain } δρομολογείται και από το { $tailnet }· εκείνο υπερισχύει."

[messages.domain-invalid]
source = "“{ $domain }” isn't a domain; use something like example.ts.net."
translation = "Το «{ $domain }» δεν είναι τομέας· χρησιμοποιήστε κάτι σαν example.ts.net."

[messages.done]
source = "Done"
translation = "Τέλος"

[messages.dutch]
source = "Dutch"
translation = "Ολλανδικά"

[messages.edit-forwards]
source = "Edit forwards"
translation = "Επεξεργασία προωθήσεων"

[messages.edit-names]
source = "Edit names"
translation = "Επεξεργασία ονομάτων"

[messages.edit-tailnet-menu]
source = "Rename or add domains…"
translation = "Μετονομασία ή προσθήκη τομέων…"

[messages.edit-title]
source = "Edit { $tailnet }"
translation = "Επεξεργασία: { $tailnet }"

[messages.english]
source = "English"
translation = "Αγγλικά"

[messages.error-details]
source = "Details are in { $path }"
translation = "Λεπτομέρειες στο { $path }"

[messages.error-title]
source = "Something went wrong"
translation = "Κάτι πήγε στραβά"

[messages.extra-domains]
source = "Extra domains (optional)"
translation = "Επιπλέον τομείς (προαιρετικά)"

[messages.extra-domains-help]
source = "The tailnet's own domain is routed automatically. Add one per line."
translation = "Ο τομέας του ίδιου του tailnet δρομολογείται αυτόματα. Προσθέστε έναν ανά γραμμή."

[messages.find-websites]
source = "Look for websites on the machines in your tailnets"
translation = "Αναζήτηση ιστότοπων στα μηχανήματα των tailnet σας"

[messages.finnish]
source = "Finnish"
translation = "Φινλανδικά"

[messages.forward-cant-listen]
source = "Can't listen: { $error }"
translation = "Αδυναμία ακρόασης: { $error }"

[messages.forward-dialog-text]
source = "Get a port on this computer that leads to { $host }. Which port on that machine?"
translation = "Αποκτήστε μια θύρα σε αυτόν τον υπολογιστή που οδηγεί στο { $host }. Ποια θύρα σε εκείνο το μηχάνημα;"

[messages.forward-dialog-title]
source = "Forward a port"
translation = "Προώθηση θύρας"

[messages.forward-no-tailnet]
source = "No routing tailnet has this name"
translation = "Κανένα tailnet με ενεργή δρομολόγηση δεν έχει αυτό το όνομα"

[messages.forward-port-on-save]
source = "A port is picked when you save"
translation = "Μια θύρα επιλέγεται κατά την αποθήκευση"

[messages.forward-port-tooltip]
source = "Forward a port: for apps that ignore the proxy setting, like Remote Desktop or a database client"
translation = "Προώθηση θύρας: για εφαρμογές που αγνοούν τη ρύθμιση διακομιστή μεσολάβησης, όπως η Απομακρυσμένη επιφάνεια εργασίας ή ένα πρόγραμμα-πελάτης βάσης δεδομένων"

[messages.forward-ready-note]
source = "The port stays the same. You'll find it in Settings."
translation = "Η θύρα παραμένει ίδια. Θα τη βρείτε στις Ρυθμίσεις."

[messages.forward-ready-text]
source = "Point your app at this address to reach { $target }:"
translation = "Ρυθμίστε την εφαρμογή σας σε αυτή τη διεύθυνση για πρόσβαση στο { $target }:"

[messages.forward-ready-title]
source = "Port forward ready"
translation = "Η προώθηση θύρας είναι έτοιμη"

[messages.forward-via]
source = "via { $tailnet }"
translation = "μέσω { $tailnet }"

[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Μία ανά γραμμή: LOCALPORT = host:port, ή auto = host:port για να επιλεγεί μια ελεύθερη θύρα. Το όνομα του μηχανήματος καθορίζει ποιο tailnet τη μεταφέρει. Για γρήγορη προσθήκη, χρησιμοποιήστε το κουμπί με το βύσμα δίπλα σε ένα μηχάνημα στην καρτέλα Tailnet."

[messages.forwards-heading]
source = "Port forwards"
translation = "Προωθήσεις θυρών"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Για εφαρμογές που αγνοούν τη ρύθμιση διακομιστή μεσολάβησης, όπως η Απομακρυσμένη επιφάνεια εργασίας, το SSH και τα προγράμματα-πελάτες βάσεων δεδομένων. Κάθε προώθηση είναι μια θύρα σε αυτόν τον υπολογιστή που οδηγεί σε ένα μηχάνημα ενός tailnet."

[messages.forwards-line-duplicate]
source = "Line { $line }: local port { $port } is used twice."
translation = "Γραμμή { $line }: η τοπική θύρα { $port } χρησιμοποιείται δύο φορές."

[messages.forwards-line-format]
source = "Line { $line }: write LOCALPORT = host:port."
translation = "Γραμμή { $line }: γράψτε LOCALPORT = host:port."

[messages.forwards-line-port]
source = "Line { $line }: “{ $value }” isn't a port number (or auto)."
translation = "Γραμμή { $line }: το «{ $value }» δεν είναι αριθμός θύρας (ούτε auto)."

[messages.forwards-line-target]
source = "Line { $line }: “{ $value }” should be host:port."
translation = "Γραμμή { $line }: το «{ $value }» πρέπει να έχει τη μορφή host:port."

[messages.french]
source = "French"
translation = "Γαλλικά"

[messages.general-heading]
source = "General"
translation = "Γενικά"

[messages.german]
source = "German"
translation = "Γερμανικά"

[messages.greek]
source = "Greek"
translation = "Ελληνικά"

[messages.hero-connecting]
source = "Connecting to your tailnets."
translation = "Γίνεται σύνδεση με τα tailnet σας."

[messages.hero-finish-sign-in]
source = "Finish signing in to { $tailnet } in your browser."
translation = "Ολοκληρώστε τη σύνδεση στο { $tailnet } στο πρόγραμμα περιήγησης."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Τίποτα δεν περνά από άλλα tailnet αυτή τη στιγμή. Το δικό σας δίκτυο και το tailnet σας λειτουργούν κανονικά."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Το πρόγραμμα περιήγησης δεν θα ανοίξει διευθύνσεις αυτών των tailnet: κάτι άλλο άλλαξε τη ρύθμιση διακομιστή μεσολάβησης συστήματος."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Το πρόγραμμα περιήγησης δεν θα ανοίξει διευθύνσεις αυτών των tailnet: δεν ήταν δυνατή η αλλαγή της ρύθμισης διακομιστή μεσολάβησης συστήματος ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "Η ρύθμιση διακομιστή μεσολάβησης συστήματος είναι ανενεργή, οπότε μόνο οι εφαρμογές που ρυθμίζετε εσείς φτάνουν σε αυτά τα tailnet. Κατευθύνετέ τες στο { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Το πρόγραμμα περιήγησης δεν θα ανοίξει διευθύνσεις αυτών των tailnet: ένα άλλο αντίγραφο του { -app-name } κατέχει τη ρύθμιση διακομιστή μεσολάβησης συστήματος. Κλείστε εκείνο το αντίγραφο και θα την αναλάβει αυτό.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "Το πρόγραμμα περιήγησης δεν θα ανοίξει διευθύνσεις αυτών των tailnet: η ρύθμιση διακομιστή μεσολάβησης συστήματος χρησιμοποιεί άλλο σενάριο ρύθμισης ({ $script })."

[messages.hero-routing]
source = "Addresses in these tailnets open in your browser. Everything else goes direct."
translation = "Οι διευθύνσεις σε αυτά τα tailnet ανοίγουν στο πρόγραμμα περιήγησης. Όλα τα υπόλοιπα πηγαίνουν απευθείας."

[messages.hero-routing-example]
source = "Open { $address } or any other address in these tailnets. Everything else goes direct."
translation = "Ανοίξτε το { $address } ή οποιαδήποτε άλλη διεύθυνση σε αυτά τα tailnet. Όλα τα υπόλοιπα πηγαίνουν απευθείας."

[messages.hero-sign-in]
source = "Sign in to { $tailnet } to reach its machines."
translation = "Συνδεθείτε στο { $tailnet } για πρόσβαση στα μηχανήματά του."

[messages.hero-starting]
source = "Starting…"
translation = "Εκκίνηση…"

