translation = "Ενεργή, με αντικατάσταση του σεναρίου διακομιστή μεσολάβησης της εταιρείας σας όσο εκτελείται"

[messages.proxy-heading]
source = "System proxy setting"
translation = "Ρύθμιση διακομιστή μεσολάβησης συστήματος"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "Η επιλογή «Ενεργή» ορίζει τη ρύθμιση διακομιστή μεσολάβησης του GNOME ή του KDE όσο η εφαρμογή εκτελείται και δρομολογεί, και την επαναφέρει μετά. Στο Firefox, ενεργοποιήστε: Ρυθμίσεις > Ρυθμίσεις δικτύου > «Χρήση ρυθμίσεων διακομιστή μεσολάβησης συστήματος»."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "Η επιλογή «Ενεργή» ορίζει τον διακομιστή μεσολάβησης για τις υπηρεσίες δικτύου σας όσο εκτελείται η εφαρμογή και τον επαναφέρει μετά. Αν το Mac σας χρειάζεται κωδικό διαχειριστή γι' αυτό, θα σας ζητηθεί κατά την έναρξη της δρομολόγησης και κατά την έξοδο."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "Η επιλογή «Ενεργή» κατευθύνει τα Windows στους κανόνες αυτής της εφαρμογής μόνο όσο εκτελείται και δρομολογεί, και επαναφέρει τα πάντα όταν σταματά, τίθεται σε παύση, αποσυνδέεται ή καταρρέει."

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "Ανενεργή: θα ρυθμίσω τις εφαρμογές μου χειροκίνητα"

