translation = "Άνοιγμα του { $url } στο πρόγραμμα περιήγησης"

[messages.open-log]
source = "Open log"
translation = "Άνοιγμα αρχείου καταγραφής"

[messages.open-remote-desktop]
source = "Open Remote Desktop"
translation = "Άνοιγμα Απομακρυσμένης επιφάνειας εργασίας"

[messages.open-remote-desktop-to]
source = "Open Remote Desktop to { $address }"
translation = "Άνοιγμα Απομακρυσμένης επιφάνειας εργασίας προς { $address }"

[messages.open-settings-folder]
source = "Open settings folder"
translation = "Άνοιγμα φακέλου ρυθμίσεων"

[messages.open-terminal-failed]
source = "Couldn't open a terminal: { $error }"
translation = "Δεν ήταν δυνατό το άνοιγμα τερματικού: { $error }"

[messages.open-terminal-missing]
source = """
{ -app-name } can't find tl, its terminal helper, next to the app. Reinstall { -app-name } to get it.

# reference -app-name
Tailnet Link"""
translation = """
Το { -app-name } δεν βρίσκει το tl, το βοηθητικό του πρόγραμμα για το τερματικό, δίπλα στην εφαρμογή. Εγκαταστήστε ξανά το { -app-name } για να το αποκτήσετε.

# reference -app-name
Tailnet Link"""

