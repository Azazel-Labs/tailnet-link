[messages.machine-search-hint]
source = "Find a machine by name, OS or address"
translation = "Εύρεση μηχανήματος με όνομα, ΛΣ ή διεύθυνση"

[messages.machines-matching]
source = "Machines · { $shown } of { $total } match"
translation = "Μηχανήματα · { $shown } από { $total } ταιριάζουν"

[messages.machines-online]
source = "Machines · { $online } of { $total } online"
translation = "Μηχανήματα · { $online } από { $total } συνδεδεμένα"

[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Δεν ήταν δυνατή η μεταφορά των συνδέσεών σας από το tailnet-proxy, την προηγούμενη έκδοση αυτής της εφαρμογής ({ $error }). Μάλλον εκτελείται ακόμα. Κλείστε το tailnet-proxy και μετά ξεκινήστε ξανά το { -app-name } πριν συνδεθείτε εδώ: μια νέα σύνδεση θα πρόσθετε αυτόν τον υπολογιστή σε κάθε tailnet για δεύτερη φορά.

# reference -app-name
Tailnet Link"""

[messages.more-actions]
source = "More actions"
translation = "Περισσότερες ενέργειες"

[messages.names-format-help]
source = "One per line: name = address, for example wiki = 192.168.20.15. The address can be an IP address or a machine's name. Open it as http://wiki:8080/, with the port the website uses."
translation = "Ένα ανά γραμμή: name = address, για παράδειγμα wiki = 192.168.20.15. Η διεύθυνση μπορεί να είναι διεύθυνση IP ή όνομα μηχανήματος. Ανοίξτε το ως http://wiki:8080/, με τη θύρα που χρησιμοποιεί ο ιστότοπος."

[messages.names-heading]
source = "Names"
translation = "Ονόματα"

[messages.names-help]
source = "Names of your own for addresses in your tailnets, such as a server behind a subnet router. They work in browsers and port forwards on this computer only."
translation = "Δικά σας ονόματα για διευθύνσεις στα tailnet σας, όπως ένας διακομιστής πίσω από δρομολογητή υποδικτύου. Λειτουργούν μόνο στα προγράμματα περιήγησης και στις προωθήσεις θυρών σε αυτόν τον υπολογιστή."

[messages.names-line-duplicate]
source = "Line { $line }: { $value } is named twice."
translation = "Γραμμή { $line }: το όνομα { $value } εμφανίζεται δύο φορές."

[messages.names-line-format]
source = "Line { $line }: write name = address."
translation = "Γραμμή { $line }: γράψτε name = address."

[messages.names-line-name]
source = "Line { $line }: “{ $value }” can't be a name. Use letters, digits, hyphens and dots."
translation = "Γραμμή { $line }: το «{ $value }» δεν μπορεί να είναι όνομα. Χρησιμοποιήστε γράμματα, ψηφία, παύλες και τελείες."

[messages.names-line-target]
source = "Line { $line }: “{ $value }” isn't an IP address or a machine's name."
translation = "Γραμμή { $line }: το «{ $value }» δεν είναι διεύθυνση IP ούτε όνομα μηχανήματος."

[messages.new-tailnet]
source = "New tailnet"
translation = "Νέο tailnet"

[messages.no-free-port]
source = "Couldn't find a free local port."
translation = "Δεν βρέθηκε ελεύθερη τοπική θύρα."

[messages.no-machine-matches]
source = "No machine matches your search."
translation = "Κανένα μηχάνημα δεν ταιριάζει με την αναζήτησή σας."

[messages.no-machines]
