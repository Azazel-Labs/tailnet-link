translation = "Indsæt det i den browser eller browserprofil, du bruger til dette tailnet"

[messages.sign-in-dialog-text]
source = """
Your browser is opening Tailscale's sign-in page. It may open behind this window.
    
    Sign in with your account for that tailnet, then come back here. Its domain is picked up automatically."""
translation = """
Din browser åbner Tailscales login-side. Den kan åbne bag dette vindue.
    
    Log ind med din konto til det tailnet, og vend så tilbage hertil. Domænet findes automatisk."""

[messages.sign-in-dialog-title]
source = "Sign in to the new tailnet"
translation = "Log ind på det nye tailnet"

[messages.sign-in-help]
source = "Browser didn't open, or opened the wrong profile?"
translation = "Åbnede browseren ikke, eller åbnede den den forkerte profil?"

[messages.sign-in-open-again]
source = "Open the sign-in page again"
translation = "Åbn login-siden igen"

