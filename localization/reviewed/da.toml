[messages.proxy-heading]
source = "System proxy setting"
translation = "Systemets proxyindstilling"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = '"Til" indstiller GNOME- eller KDE-proxyindstillingen, mens appen kører og dirigerer, og sætter den tilbage bagefter. I Firefox skal du slå Indstillinger > Netværksindstillinger > "Brug systemets proxyindstillinger" til.'

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = '"Til" indstiller proxyen for dine netværkstjenester, mens appen kører, og sætter den tilbage bagefter. Hvis din Mac kræver en administratoradgangskode til det, bliver du spurgt, når dirigeringen starter, og når du afslutter.'

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = '"Til" peger kun Windows mod denne apps regler, mens den kører og dirigerer, og sætter alt tilbage, når den stopper, sættes på pause, mister forbindelsen eller går ned.'

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "Fra: jeg sætter selv mine apps op"

[messages.proxy-on]
source = "On (recommended)"
translation = "Til (anbefales)"

