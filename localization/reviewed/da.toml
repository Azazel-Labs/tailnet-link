[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Dine logins fra tailnet-proxy, den tidligere version af denne app, kunne ikke flyttes over ({ $error }). Den kører sandsynligvis stadig. Afslut tailnet-proxy, og start derefter { -app-name } igen, før du logger ind her: Hvis du logger ind igen, bliver denne computer tilføjet til hvert tailnet en gang til.

# reference -app-name
Tailnet Link"""

