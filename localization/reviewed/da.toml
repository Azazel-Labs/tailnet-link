[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "{ $host } findes på mere end ét tailnet ({ $tailnets }), så den dirigeres ikke. Brug maskinens navn i stedet, eller slå subnets fra for et af de tailnets."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: det er ikke en gyldig port."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Skriv et maskinnavn eller en webadresse."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } dirigeres gennem { $tailnet }, men forbindelsen til port { $port } mislykkedes: { $error }
    Tjek, at maskinen er online, og at noget lytter på den port."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Det tailnet forsvandt lige."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } dirigeres ikke af { -app-name }: den er ikke et navn, en adresse eller et subnet på noget tailnet, der dirigerer lige nu, så den går direkte (gennem dit normale netværk og dit eget Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "{ $tailnet } kører ikke."

[messages.check-ok]
