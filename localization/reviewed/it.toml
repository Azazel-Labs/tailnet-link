[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Uno per riga: LOCALPORT = host:port, oppure auto = host:port per scegliere una porta libera. Il nome dell'host decide quale tailnet lo trasporta. Per aggiungerne uno al volo, usa il pulsante a forma di spina accanto a un dispositivo nella scheda Tailnet."

[messages.forwards-heading]
source = "Port forwards"
translation = "Port forwarding"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Per le app che ignorano l'impostazione del proxy, come Desktop remoto, SSH e i client di database. Ogni inoltro è una porta di questo computer che conduce a un dispositivo in un tailnet."

[messages.forwards-line-duplicate]
source = "Line { $line }: local port { $port } is used twice."
translation = "Riga { $line }: la porta locale { $port } è usata due volte."

[messages.forwards-line-format]
source = "Line { $line }: write LOCALPORT = host:port."
translation = "Riga { $line }: scrivi LOCALPORT = host:port."

[messages.forwards-line-port]
source = "Line { $line }: “{ $value }” isn't a port number (or auto)."
translation = "Riga { $line }: “{ $value }” non è un numero di porta (né auto)."

[messages.forwards-line-target]
