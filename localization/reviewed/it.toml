[messages.hero-connecting]
source = "Connecting to your tailnets."
translation = "Connessione ai tuoi tailnet."

[messages.hero-finish-sign-in]
source = "Finish signing in to { $tailnet } in your browser."
translation = "Completa l'accesso a { $tailnet } nel browser."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Al momento non passa nulla attraverso gli altri tailnet. La tua rete e il tuo tailnet funzionano come sempre."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Il browser non aprirà gli indirizzi di questi tailnet: qualcos'altro ha modificato l'impostazione del proxy di sistema."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Il browser non aprirà gli indirizzi di questi tailnet: non è stato possibile modificare l'impostazione del proxy di sistema ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "L'impostazione del proxy di sistema è disattivata, quindi solo le app che configuri tu raggiungono questi tailnet. Indirizzale a { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Il browser non aprirà gli indirizzi di questi tailnet: un'altra copia di { -app-name } controlla l'impostazione del proxy di sistema. Chiudi quella copia e questa subentrerà.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "Il browser non aprirà gli indirizzi di questi tailnet: l'impostazione del proxy di sistema usa un altro script di configurazione ({ $script })."

[messages.hero-routing]
source = "Addresses in these tailnets open in your browser. Everything else goes direct."
translation = "Gli indirizzi di questi tailnet si aprono nel browser. Tutto il resto va diretto."

[messages.hero-routing-example]
source = "Open { $address } or any other address in these tailnets. Everything else goes direct."
translation = "Apri { $address } o qualsiasi altro indirizzo di questi tailnet. Tutto il resto va diretto."

