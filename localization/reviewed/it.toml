[messages.proxy-heading]
source = "System proxy setting"
translation = "Impostazione del proxy di sistema"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "“Attivo” imposta il proxy di GNOME o KDE mentre l'app è in esecuzione e instrada, e poi lo ripristina. In Firefox, attiva Impostazioni > Impostazioni di rete > “Utilizza le impostazioni proxy del sistema”."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "“Attivo” imposta il proxy per i tuoi servizi di rete mentre l'app è in esecuzione e poi lo ripristina. Se il Mac richiede una password di amministratore per farlo, ti verrà chiesta all'avvio dell'instradamento e all'uscita."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "“Attivo” indirizza Windows alle regole di questa app solo mentre è in esecuzione e instrada, e ripristina tutto quando si chiude, va in pausa, si disconnette o si arresta in modo anomalo."

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "Disattivo: configuro io le mie app"

[messages.proxy-on]
source = "On (recommended)"
translation = "Attivo (consigliato)"

