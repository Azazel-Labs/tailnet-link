[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Non è stato possibile trasferire i tuoi accessi da tailnet-proxy, la versione precedente di questa app ({ $error }). Probabilmente è ancora in esecuzione. Chiudi tailnet-proxy, poi riavvia { -app-name } prima di accedere qui: accedere di nuovo aggiungerebbe questo computer a ogni tailnet una seconda volta.

# reference -app-name
Tailnet Link"""

