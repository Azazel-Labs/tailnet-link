[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "{ $host } si trova in più di un tailnet ({ $tailnets }), quindi non viene instradato. Usa invece il nome del dispositivo, oppure disattiva le subnet per uno di quei tailnet."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: non è una porta valida."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Digita un nome di dispositivo o un indirizzo web."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } è instradato tramite { $tailnet }, ma la connessione alla porta { $port } non è riuscita: { $error }
    Controlla che il dispositivo sia online e che qualcosa sia in ascolto su quella porta."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Quel tailnet è appena scomparso."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } non viene instradato da { -app-name }: non è un nome, un indirizzo o una subnet di nessun tailnet attivo in questo momento, quindi va diretto (attraverso la tua rete normale e il tuo Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "{ $tailnet } non è in esecuzione."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } funziona: connesso tramite { $tailnet } in { $ms } ms."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "{ $host } è instradato tramite { $tailnet }, ma la porta { $port } non ha risposto entro 10 secondi."

