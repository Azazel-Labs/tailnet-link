[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Yksi riviä kohden: LOCALPORT = host:port, tai auto = host:port, jolloin vapaa portti valitaan puolestasi. Isäntänimi ratkaisee, mikä tailnet välittää yhteyden. Nopeimmin lisäät edelleenohjauksen koneen pistokepainikkeella Tailnetit-välilehdellä."

[messages.forwards-heading]
source = "Port forwards"
translation = "Portin edelleenohjaukset"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Sovelluksille, jotka ohittavat välityspalvelinasetuksen, kuten Etätyöpöytä, SSH ja tietokantaohjelmat. Jokainen edelleenohjaus on tämän tietokoneen portti, joka johtaa koneeseen jossakin tailnetissä."

