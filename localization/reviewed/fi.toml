[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Kirjoita koneen nimi tai verkko-osoite."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
Kohde { $host } reititetään tailnetin { $tailnet } kautta, mutta yhteys porttiin { $port } epäonnistui: { $error }
    Tarkista, että kone on verkossa ja että jokin kuuntelee kyseistä porttia."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Tuo tailnet katosi juuri."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } ei reititä kohdetta { $host }: se ei pääty minkään juuri nyt reitittävän tailnetin verkkotunnukseen, joten se kulkee suoraan (tavallisen verkkosi ja oman Tailscalesi kautta).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "Tailnet { $tailnet } ei ole käynnissä."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } toimii: yhteys tailnetin { $tailnet } kautta, { $ms } ms."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "Kohde { $host } reititetään tailnetin { $tailnet } kautta, mutta portti { $port } ei vastannut 10 sekunnin kuluessa."

