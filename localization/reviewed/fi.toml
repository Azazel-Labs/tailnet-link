translation = "Järjestelmän välityspalvelinasetus"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "”Käytössä” asettaa GNOMEn tai KDE:n välityspalvelinasetuksen, kun sovellus on käynnissä ja reitittää, ja palauttaa sen jälkeenpäin. Ota Firefoxissa käyttöön Asetukset > Verkkoasetukset > ”Käytä järjestelmän välityspalvelinasetuksia”."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "”Käytössä” asettaa välityspalvelimen verkkopalveluillesi sovelluksen ollessa käynnissä ja palauttaa sen jälkeenpäin. Jos Macisi vaatii tähän järjestelmänvalvojan salasanan, sitä kysytään reitityksen alkaessa ja sovelluksesta poistuttaessa."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "”Käytössä” ohjaa Windowsin tämän sovelluksen sääntöihin vain, kun sovellus on käynnissä ja reitittää, ja palauttaa kaiken ennalleen, kun se pysähtyy, keskeytetään, menettää yhteyden tai kaatuu."

