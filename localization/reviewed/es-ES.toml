translation = "Copiar el enlace"

[messages.sign-in-copy-link-tooltip]
source = "Paste it into the browser, or browser profile, you use for this tailnet"
translation = "Pégalo en el navegador, o en el perfil del navegador, que usas para este tailnet"

[messages.sign-in-dialog-text]
source = """
Your browser is opening Tailscale's sign-in page. It may open behind this window.
    
    Sign in with your account for that tailnet, then come back here. Its domain is picked up automatically."""
translation = """
Tu navegador está abriendo la página de inicio de sesión de Tailscale. Puede que se abra detrás de esta ventana.
    
    Inicia sesión con tu cuenta de ese tailnet y vuelve aquí. Su dominio se detecta automáticamente."""

[messages.sign-in-dialog-title]
source = "Sign in to the new tailnet"
translation = "Inicia sesión en el nuevo tailnet"

[messages.sign-in-help]
source = "Browser didn't open, or opened the wrong profile?"
translation = "¿No se ha abierto el navegador o se ha abierto con el perfil equivocado?"

[messages.sign-in-open-again]
