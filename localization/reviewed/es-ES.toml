[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
No se han podido trasladar tus inicios de sesión de tailnet-proxy, la versión anterior de esta aplicación ({ $error }). Probablemente siga en ejecución. Cierra tailnet-proxy y vuelve a abrir { -app-name } antes de iniciar sesión aquí: iniciar sesión de nuevo añadiría este ordenador a cada tailnet por segunda vez.

# reference -app-name
Tailnet Link"""

