[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "«Activado» configura el proxy de GNOME o KDE mientras la aplicación se ejecuta y enruta, y lo restablece después. En Firefox, activa Ajustes > Configuración de red > «Usar la configuración del proxy del sistema»."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "«Activado» configura el proxy de tus servicios de red mientras la aplicación se ejecuta y lo restablece después. Si tu Mac necesita una contraseña de administrador para ello, se te pedirá al empezar a enrutar y al salir."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "«Activado» dirige Windows a las reglas de esta aplicación solo mientras se ejecuta y enruta, y lo restablece todo cuando se cierra, se pausa, se desconecta o falla."

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "Desactivado: configuro mis aplicaciones por mi cuenta"

