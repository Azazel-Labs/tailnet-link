translation = "Termina de iniciar sesión en { $tailnet } desde tu navegador."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Ahora mismo no pasa nada por otros tailnets. Tu red y tu propio tailnet funcionan como siempre."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Tu navegador no abrirá las direcciones de estos tailnets: otra cosa ha cambiado el ajuste de proxy del sistema."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Tu navegador no abrirá las direcciones de estos tailnets: no se ha podido cambiar el ajuste de proxy del sistema ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "El ajuste de proxy del sistema está desactivado, así que solo las aplicaciones que configures tú llegan a estos tailnets. Dirígelas a { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Tu navegador no abrirá las direcciones de estos tailnets: otra copia de { -app-name } tiene el ajuste de proxy del sistema. Cierra esa copia y esta tomará el relevo.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "Tu navegador no abrirá las direcciones de estos tailnets: el ajuste de proxy del sistema usa otro script de configuración ({ $script })."

[messages.hero-routing]
