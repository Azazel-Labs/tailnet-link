[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "{ $host } está en más de un tailnet ({ $tailnets }), así que no se enruta. Usa el nombre del equipo en su lugar o desactiva las subredes de uno de esos tailnets."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: no es un puerto válido."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Escribe un nombre de equipo o una dirección web."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } se enruta a través de { $tailnet }, pero la conexión al puerto { $port } ha fallado: { $error }
    Comprueba que el equipo está en línea y que algo escucha en ese puerto."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Ese tailnet acaba de desaparecer."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } no enruta { $host }: no es un nombre, una dirección ni una subred de ningún tailnet que esté enrutando ahora mismo, así que va directo (por tu red normal y tu propio Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "{ $tailnet } no se está ejecutando."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } funciona: conectado a través de { $tailnet } en { $ms } ms."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "{ $host } se enruta a través de { $tailnet }, pero el puerto { $port } no ha respondido en 10 segundos."

