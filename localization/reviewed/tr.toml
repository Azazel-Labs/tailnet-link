[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "“Açık” seçeneği, uygulama çalışıp yönlendirme yaparken GNOME veya KDE proxy ayarını yapar ve sonrasında eski haline getirir. Firefox'ta Ayarlar > Ağ ayarları > “Sistem vekil sunucu ayarlarını kullan” seçeneğini açın."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "“Açık” seçeneği, uygulama çalışırken ağ hizmetleriniz için proxy'yi ayarlar ve sonrasında eski haline getirir. Mac'iniz bunun için yönetici parolası gerektiriyorsa, yönlendirme başladığında ve çıkış yaptığınızda parola istenir."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "“Açık” seçeneği Windows'u yalnızca uygulama çalışıp yönlendirme yaparken bu uygulamanın kurallarına yönlendirir; uygulama durduğunda, duraklatıldığında, bağlantısı kesildiğinde veya çöktüğünde her şeyi eski haline getirir."

