[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Her satıra bir tane: LOCALPORT = host:port veya boş bir port seçilmesi için auto = host:port. Hangi tailnet'in taşıyacağını makinenin adı belirler. Hızlıca eklemek için Tailnet'ler sekmesinde bir makinenin yanındaki fiş düğmesini kullanın."

