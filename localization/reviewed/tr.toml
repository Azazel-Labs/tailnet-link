Bu uygulamanın önceki sürümü olan tailnet-proxy'deki oturumlarınız taşınamadı ({ $error }). Muhtemelen hâlâ çalışıyor. tailnet-proxy'den çıkın, ardından burada oturum açmadan önce { -app-name } uygulamasını yeniden başlatın: yeniden oturum açmak bu bilgisayarı her tailnet'e ikinci kez ekler.

