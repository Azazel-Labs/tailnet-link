{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host }, { -app-name } tarafından yönlendirilmiyor: şu anda yönlendirme yapan hiçbir tailnet'in alan adıyla bitmiyor, bu yüzden doğrudan gidiyor (normal ağınız ve kendi Tailscale'iniz üzerinden).

