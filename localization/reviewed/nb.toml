source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Én per linje: LOCALPORT = host:port, eller auto = host:port for å få valgt en ledig port. Vertsnavnet avgjør hvilket tailnet som bærer den. Du legger raskt til en med støpselknappen ved en maskin i fanen Tailnets."

