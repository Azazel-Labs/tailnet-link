[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } rutes gjennom { $tailnet }, men tilkoblingen til port { $port } mislyktes: { $error }
    Kontroller at maskinen er på nett og at noe lytter på den porten."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Det tailnettet forsvant akkurat."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } rutes ikke av { -app-name }: den slutter ikke på domenet til noe tailnet som ruter akkurat nå, så den går direkte (gjennom det vanlige nettverket ditt og ditt eget Tailscale).

# reference -app-name
Tailnet Link"""

