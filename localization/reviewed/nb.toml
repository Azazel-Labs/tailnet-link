[messages.unsaved-changes]
source = "You have unsaved changes."
translation = "Du har endringer som ikke er lagret."

[messages.vietnamese]
source = "Vietnamese"
translation = "Vietnamesisk"

[messages.welcome-forward]
source = "Forward a port when an app needs one"
translation = "Videresend en port når en app trenger det"

[messages.welcome-forward-detail]
source = "Remote Desktop, SSH and database apps get a local port that leads to a machine."
translation = "Eksternt skrivebord, SSH og databaseapper får en lokal port som leder til en maskin."

[messages.welcome-open]
source = "Open its machines by name"
translation = "Åpne maskinene der ved navn"

[messages.welcome-open-detail]
source = "Addresses like { $example } work in your browser."
translation = "Adresser som { $example } fungerer i nettleseren."

[messages.welcome-sign-in]
source = "Sign in to another tailnet"
translation = "Logg på et annet tailnet"

[messages.welcome-sign-in-detail]
source = "Tailscale's sign-in page opens in your browser."
translation = "Tailscales påloggingsside åpnes i nettleseren."

[messages.welcome-text]
source = "Stay on your own tailnet and open machines in others at the same time. Your Tailscale app keeps working as usual."
translation = "Bli på ditt eget tailnet og åpne maskiner på andre samtidig. Tailscale-appen fungerer som vanlig."

[messages.welcome-title]
source = "Reach machines on other tailnets"
translation = "Nå maskiner på andre tailnets"
