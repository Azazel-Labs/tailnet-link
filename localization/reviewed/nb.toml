[messages.troubleshooting-heading]
source = "Troubleshooting"
translation = "Feilsøking"

[messages.troubleshooting-help]
source = "Test a web address or name:port to see which tailnet carries it and whether it connects."
translation = "Test en nettadresse eller navn:port for å se hvilket tailnet som bærer den, og om tilkoblingen fungerer."

