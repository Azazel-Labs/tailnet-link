[messages.proxy-heading]
source = "System proxy setting"
translation = "システムのプロキシ設定"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "「オン」にすると、アプリが実行中でルーティングしている間は GNOME または KDE のプロキシ設定を変更し、終了後に元に戻します。Firefox では、[設定] > [ネットワーク設定] で「システムのプロキシ設定を利用する」をオンにしてください。"

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "「オン」にすると、アプリの実行中はネットワーク サービスのプロキシを設定し、終了後に元に戻します。Mac で管理者パスワードが必要な場合は、ルーティングの開始時と終了時に入力を求められます。"

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "「オン」にすると、このアプリが実行中でルーティングしている間だけ Windows がこのアプリのルールを使います。停止、一時停止、切断、クラッシュ時には元の設定に戻ります。"

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "オフ: アプリは自分で設定する"

[messages.proxy-on]
source = "On (recommended)"
translation = "オン (推奨)"

[messages.proxy-replace]
source = "Replace it"
translation = "置き換える"

[messages.proxy-replace-tooltip]
source = """
Use { -app-name }'s setup script while it runs, and put the other one back afterwards

# reference -app-name
Tailnet Link"""
translation = """
実行中は { -app-name } のセットアップ スクリプトを使い、終了後に元のスクリプトに戻します

# reference -app-name
Tailnet Link"""

