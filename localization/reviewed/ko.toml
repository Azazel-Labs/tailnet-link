[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "“켜기”를 선택하면 앱이 실행되어 라우팅하는 동안 GNOME 또는 KDE 프록시 설정을 변경하고 이후 원래대로 되돌립니다. Firefox에서는 설정 > 네트워크 설정에서 “시스템 프록시 설정 사용”을 켜세요."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "“켜기”를 선택하면 앱이 실행되는 동안 네트워크 서비스의 프록시를 설정하고 이후 원래대로 되돌립니다. Mac에서 이 작업에 관리자 암호가 필요하면 라우팅을 시작할 때와 종료할 때 암호를 묻습니다."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "“켜기”를 선택하면 앱이 실행되어 라우팅하는 동안에만 Windows가 이 앱의 규칙을 사용하며, 앱이 중지, 일시 중지, 연결 해제되거나 비정상 종료되면 원래대로 되돌립니다."

