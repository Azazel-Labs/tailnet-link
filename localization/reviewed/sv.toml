Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Dina inloggningar från tailnet-proxy, den tidigare versionen av den här appen, kunde inte flyttas över ({ $error }). Den körs troligen fortfarande. Avsluta tailnet-proxy och starta sedan { -app-name } igen innan du loggar in här: om du loggar in igen läggs den här datorn till i varje tailnet en andra gång.

# reference -app-name
Tailnet Link"""

