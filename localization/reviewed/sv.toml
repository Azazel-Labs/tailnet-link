source = "That tailnet just went away."
translation = "Det tailnetet försvann precis."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } dirigeras inte av { -app-name }: adressen slutar inte på domänen för något tailnet som dirigerar just nu, så den går direkt (via ditt vanliga nätverk och ditt eget Tailscale).

# reference -app-name
Tailnet Link"""

