translation = "Portvidarebefordringar"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "För appar som ignorerar proxyinställningen, som Fjärrskrivbord, SSH och databasklienter. Varje vidarebefordring är en port på den här datorn som leder till en dator i ett tailnet."

