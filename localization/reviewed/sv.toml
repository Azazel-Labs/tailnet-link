[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } dirigeras via { $tailnet }, men anslutningen till port { $port } misslyckades: { $error }
    Kontrollera att datorn är online och att något lyssnar på den porten."""

