[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } word deur { $tailnet } geroeteer, maar koppeling aan poort { $port } het misluk: { $error }
    Kontroleer dat die masjien aanlyn is en dat iets op daardie poort luister."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Daardie tailnet het pas verdwyn."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } word nie deur { -app-name } geroeteer nie: dit eindig nie op die domein van enige tailnet wat nou roeteer nie, so dit gaan direk (deur jou gewone netwerk en jou eie Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "{ $tailnet } loop nie."

[messages.check-ok]
