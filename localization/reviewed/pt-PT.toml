translation = "Reencaminhamentos de portas"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Para aplicações que ignoram a definição de proxy, como o Ambiente de Trabalho Remoto, SSH e clientes de bases de dados. Cada reencaminhamento é uma porta neste computador que leva a uma máquina numa tailnet."

