Não foi possível mover as suas sessões iniciadas do tailnet-proxy, a versão anterior desta aplicação ({ $error }). Provavelmente ainda está em execução. Feche o tailnet-proxy e inicie novamente o { -app-name } antes de iniciar sessão aqui: iniciar sessão novamente adicionaria este computador a cada tailnet uma segunda vez.

