[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = '"Ativada" altera a definição de proxy do GNOME ou do KDE enquanto a aplicação está em execução e a encaminhar, e repõe-na depois. No Firefox, ative Definições > Definições de rede > "Utilizar definições de proxy do sistema".'

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = '"Ativada" define o proxy dos seus serviços de rede enquanto a aplicação está em execução e repõe-no depois. Se o seu Mac precisar de uma palavra-passe de administrador para isso, ser-lhe-á pedida quando o encaminhamento começar e quando sair.'

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = '"Ativada" aponta o Windows para as regras desta aplicação apenas enquanto está em execução e a encaminhar, e repõe tudo quando para, é suspensa, perde a ligação ou falha.'

