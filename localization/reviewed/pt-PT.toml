source = "That tailnet just went away."
translation = "Essa tailnet acabou de desaparecer."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } não é encaminhado pelo { -app-name }: não termina no domínio de nenhuma tailnet que esteja a encaminhar neste momento, por isso segue diretamente (pela sua rede normal e pelo seu próprio Tailscale).

# reference -app-name
Tailnet Link"""

