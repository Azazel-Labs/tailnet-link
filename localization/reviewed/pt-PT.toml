[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } é encaminhado através de { $tailnet }, mas a ligação à porta { $port } falhou: { $error }
    Verifique se a máquina está online e se há algo à escuta nessa porta."""

