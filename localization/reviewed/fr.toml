Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Vos connexions de tailnet-proxy, l’ancienne version de cette application, n’ont pas pu être transférées ({ $error }). Il est probablement encore en cours d’exécution. Quittez tailnet-proxy, puis redémarrez { -app-name } avant de vous connecter ici : se connecter à nouveau ajouterait cet ordinateur une seconde fois à chaque tailnet.

# reference -app-name
Tailnet Link"""

