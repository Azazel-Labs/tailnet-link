[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "« Activé » définit le proxy de GNOME ou KDE pendant que l’application tourne et route, puis le rétablit ensuite. Dans Firefox, activez Paramètres > Paramètres réseau > « Utiliser les paramètres proxy du système »."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "« Activé » définit le proxy de vos services réseau pendant que l’application tourne, puis le rétablit ensuite. Si votre Mac exige un mot de passe administrateur pour cela, il vous sera demandé au démarrage du routage et à la fermeture."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "« Activé » applique les règles de cette application à Windows uniquement pendant qu’elle tourne et route, puis rétablit tout quand elle s’arrête, se met en pause, se déconnecte ou plante."

