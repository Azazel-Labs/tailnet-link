[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Une par ligne : LOCALPORT = host:port, ou auto = host:port pour obtenir un port libre. Le nom de l’hôte détermine le tailnet utilisé. Pour en ajouter une rapidement, utilisez le bouton en forme de prise à côté d’une machine dans l’onglet Tailnets."

[messages.forwards-heading]
source = "Port forwards"
translation = "Redirections de port"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Pour les applications qui ignorent le paramètre de proxy, comme Bureau à distance, SSH et les clients de bases de données. Chaque redirection est un port de cet ordinateur qui mène à une machine d’un tailnet."

