{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } n’est pas routé par { -app-name } : il ne se termine par le domaine d’aucun tailnet actif en ce moment, il passe donc en direct (par votre réseau habituel et votre propre Tailscale).

# reference -app-name
Tailnet Link"""

