source = "Connecting to your tailnets."
translation = "Menghubungkan ke tailnet Anda."

[messages.hero-finish-sign-in]
source = "Finish signing in to { $tailnet } in your browser."
translation = "Selesaikan proses masuk ke { $tailnet } di browser Anda."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Saat ini tidak ada yang melewati tailnet lain. Jaringan dan tailnet Anda sendiri berfungsi seperti biasa."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Browser Anda tidak akan membuka alamat di tailnet ini: sesuatu yang lain telah mengubah pengaturan proksi sistem."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Browser Anda tidak akan membuka alamat di tailnet ini: pengaturan proksi sistem tidak dapat diubah ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "Pengaturan proksi sistem nonaktif, jadi hanya aplikasi yang Anda atur sendiri yang dapat menjangkau tailnet ini. Arahkan aplikasi tersebut ke { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Browser Anda tidak akan membuka alamat di tailnet ini: salinan { -app-name } yang lain sedang memegang pengaturan proksi sistem. Tutup salinan itu, lalu salinan ini akan mengambil alih.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "Browser Anda tidak akan membuka alamat di tailnet ini: pengaturan proksi sistem menggunakan skrip penyiapan lain ({ $script })."

[messages.hero-routing]
source = "Addresses in these tailnets open in your browser. Everything else goes direct."
translation = "Alamat di tailnet ini terbuka di browser Anda. Selebihnya berjalan langsung."

[messages.hero-routing-example]
source = "Open { $address } or any other address in these tailnets. Everything else goes direct."
translation = "Buka { $address } atau alamat lain di tailnet ini. Selebihnya berjalan langsung."

