[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Sesi masuk Anda dari tailnet-proxy, versi lama aplikasi ini, tidak dapat dipindahkan ({ $error }). Aplikasi itu mungkin masih berjalan. Tutup tailnet-proxy, lalu jalankan ulang { -app-name } sebelum Anda masuk di sini: masuk lagi akan menambahkan komputer ini ke setiap tailnet untuk kedua kalinya.

# reference -app-name
Tailnet Link"""

