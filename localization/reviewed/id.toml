[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = '"Aktif" mengatur proksi GNOME atau KDE selama aplikasi berjalan dan merutekan, lalu mengembalikannya setelahnya. Di Firefox, aktifkan Pengaturan > Setelan Jaringan > "Gunakan pengaturan proksi dari sistem".'

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = '"Aktif" mengatur proksi untuk layanan jaringan Anda selama aplikasi berjalan, lalu mengembalikannya setelahnya. Jika Mac Anda memerlukan kata sandi admin untuk itu, Anda akan dimintai kata sandi saat perutean dimulai dan saat Anda keluar.'

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = '"Aktif" mengarahkan Windows ke aturan aplikasi ini hanya selama aplikasi berjalan dan merutekan, lalu mengembalikan semuanya saat aplikasi berhenti, dijeda, terputus, atau mogok.'

