translation = "Ketik nama mesin atau alamat web."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } dirutekan melalui { $tailnet }, tetapi koneksi ke port { $port } gagal: { $error }
    Pastikan mesin sedang daring dan ada yang mendengarkan di port tersebut."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Tailnet itu baru saja hilang."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } tidak dirutekan oleh { -app-name }: alamat ini tidak berakhiran domain tailnet mana pun yang sedang merutekan, jadi lalu lintasnya berjalan langsung (melalui jaringan biasa dan Tailscale Anda sendiri).

# reference -app-name
Tailnet Link"""

