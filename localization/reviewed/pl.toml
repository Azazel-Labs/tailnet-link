[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Wpisz nazwę urządzenia lub adres internetowy."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
Ruch do { $host } idzie przez { $tailnet }, ale połączenie z portem { $port } nie powiodło się: { $error }
    Sprawdź, czy urządzenie jest online i czy coś nasłuchuje na tym porcie."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Ta sieć tailnet właśnie zniknęła."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } nie obsługuje { $host }: adres nie kończy się domeną żadnej aktywnej teraz sieci tailnet, więc idzie bezpośrednio (przez zwykłą sieć i własny Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "Sieć { $tailnet } nie działa."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } działa: połączono przez { $tailnet } w { $ms } ms."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "Ruch do { $host } idzie przez { $tailnet }, ale port { $port } nie odpowiedział w ciągu 10 sekund."

