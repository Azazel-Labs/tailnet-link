[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Nie udało się przenieść twoich logowań z tailnet-proxy, wcześniejszej wersji tej aplikacji ({ $error }). Prawdopodobnie nadal działa. Zamknij tailnet-proxy, a potem uruchom ponownie { -app-name }, zanim zalogujesz się tutaj: ponowne logowanie dodałoby ten komputer do każdej sieci tailnet drugi raz.

# reference -app-name
Tailnet Link"""

[messages.more-actions]
source = "More actions"
