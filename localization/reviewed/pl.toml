[messages.proxy-heading]
source = "System proxy setting"
translation = "Systemowe ustawienie proxy"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "„Włączone” ustawia proxy w GNOME lub KDE, gdy aplikacja działa i przekazuje ruch, a potem przywraca poprzedni stan. W przeglądarce Firefox włącz Ustawienia > Ustawienia sieci > „Używaj systemowych ustawień serwerów proxy”."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "„Włączone” ustawia proxy dla usług sieciowych, gdy aplikacja działa, a potem przywraca poprzedni stan. Jeśli Mac wymaga do tego hasła administratora, poprosi o nie przy starcie routingu i przy zamykaniu aplikacji."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "„Włączone” kieruje Windows na reguły tej aplikacji tylko wtedy, gdy działa i przekazuje ruch, a przywraca poprzedni stan, gdy się zatrzyma, wstrzyma, rozłączy lub ulegnie awarii."

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "Wyłączone: skonfiguruję aplikacje ręcznie"

