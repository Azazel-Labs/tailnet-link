[messages.hero-connecting]
source = "Connecting to your tailnets."
translation = "Łączenie z sieciami tailnet."

[messages.hero-finish-sign-in]
source = "Finish signing in to { $tailnet } in your browser."
translation = "Dokończ logowanie do { $tailnet } w przeglądarce."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Teraz nic nie przechodzi przez inne sieci tailnet. Twoja sieć lokalna i własna sieć tailnet działają jak zwykle."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Przeglądarka nie otworzy adresów z tych sieci tailnet: coś innego zmieniło systemowe ustawienie proxy."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Przeglądarka nie otworzy adresów z tych sieci tailnet: nie udało się zmienić systemowego ustawienia proxy ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "Systemowe ustawienie proxy jest wyłączone, więc do tych sieci tailnet docierają tylko aplikacje skonfigurowane przez ciebie. Wskaż im adres { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Przeglądarka nie otworzy adresów z tych sieci tailnet: systemowe ustawienie proxy zajmuje inna kopia aplikacji { -app-name }. Zamknij tamtą kopię, a ta przejmie ustawienie.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "Przeglądarka nie otworzy adresów z tych sieci tailnet: systemowe ustawienie proxy używa innego skryptu konfiguracji ({ $script })."

[messages.hero-routing]
source = "Addresses in these tailnets open in your browser. Everything else goes direct."
translation = "Adresy w tych sieciach tailnet otwierają się w przeglądarce. Cała reszta idzie bezpośrednio."

[messages.hero-routing-example]
source = "Open { $address } or any other address in these tailnets. Everything else goes direct."
translation = "Otwórz { $address } lub dowolny inny adres w tych sieciach tailnet. Cała reszta idzie bezpośrednio."

