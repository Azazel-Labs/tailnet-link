[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Je logins uit tailnet-proxy, de eerdere versie van deze app, konden niet worden overgezet ({ $error }). Het draait waarschijnlijk nog. Sluit tailnet-proxy af en start { -app-name } opnieuw voordat je hier inlogt: opnieuw inloggen zou deze computer een tweede keer aan elk tailnet toevoegen.

# reference -app-name
Tailnet Link"""

