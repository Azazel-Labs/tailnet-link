[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "{ $host } zit in meer dan één tailnet ({ $tailnets }), dus het wordt niet gerouteerd. Gebruik in plaats daarvan de naam van de machine, of zet subnetten uit voor een van die tailnets."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: dat is geen geldige poort."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Typ een machinenaam of een webadres."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } wordt gerouteerd via { $tailnet }, maar verbinden met poort { $port } is mislukt: { $error }
    Controleer of de machine online is en of er iets op die poort luistert."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Dat tailnet is net verdwenen."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } wordt niet gerouteerd door { -app-name }: het is geen naam, adres of subnet van een tailnet dat nu routeert, dus het gaat rechtstreeks (via je normale netwerk en je eigen Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "{ $tailnet } draait niet."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } werkt: verbonden via { $tailnet } in { $ms } ms."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "{ $host } wordt gerouteerd via { $tailnet }, maar poort { $port } antwoordde niet binnen 10 seconden."

