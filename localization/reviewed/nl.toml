[messages.hero-finish-sign-in]
source = "Finish signing in to { $tailnet } in your browser."
translation = "Rond het inloggen bij { $tailnet } af in je browser."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Er gaat nu niets via andere tailnets. Je eigen netwerk en tailnet werken gewoon."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Je browser opent de adressen van deze tailnets niet: iets anders heeft de proxyinstelling van het systeem gewijzigd."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Je browser opent de adressen van deze tailnets niet: de proxyinstelling van het systeem kon niet worden gewijzigd ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "De proxyinstelling van het systeem staat uit, dus alleen apps die je zelf instelt bereiken deze tailnets. Laat ze verwijzen naar { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Je browser opent de adressen van deze tailnets niet: een ander exemplaar van { -app-name } beheert de proxyinstelling van het systeem. Sluit dat exemplaar af, dan neemt dit het over.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "Je browser opent de adressen van deze tailnets niet: de proxyinstelling van het systeem gebruikt een ander setupscript ({ $script })."

[messages.hero-routing]
