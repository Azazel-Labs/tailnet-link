translation = "Extern bureaublad, SSH en database-apps krijgen een lokale poort die naar een machine leidt."

[messages.welcome-open]
source = "Open its machines by name"
translation = "Open de machines ervan op naam"

[messages.welcome-open-detail]
source = "Addresses like { $example } work in your browser."
translation = "Adressen zoals { $example } werken in je browser."

