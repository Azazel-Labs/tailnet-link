translation = "Proxyinstelling van het systeem"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "'Aan' stelt de proxyinstelling van GNOME of KDE in zolang de app draait en routeert, en zet die daarna terug. Zet in Firefox Instellingen > Netwerkinstellingen > 'Systeemproxy-instellingen gebruiken' aan."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "'Aan' stelt de proxy voor je netwerkservices in zolang de app draait en zet hem daarna terug. Als je Mac daarvoor een beheerderswachtwoord nodig heeft, wordt dat gevraagd wanneer het routeren begint en wanneer je afsluit."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "'Aan' laat Windows alleen de regels van deze app gebruiken zolang die draait en routeert, en zet alles terug wanneer de app stopt, pauzeert, de verbinding verliest of crasht."

