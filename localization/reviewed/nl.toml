[messages.welcome-sign-in-detail]
source = "Tailscale's sign-in page opens in your browser."
translation = "De inlogpagina van Tailscale opent in je browser."

[messages.welcome-text]
source = "Stay on your own tailnet and open machines in others at the same time. Your Tailscale app keeps working as usual."
translation = "Blijf op je eigen tailnet en open tegelijk machines in andere. Je Tailscale-app blijft gewoon werken."

[messages.welcome-title]
