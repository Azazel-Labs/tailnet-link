[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } wordt gerouteerd via { $tailnet }, maar verbinden met poort { $port } is mislukt: { $error }
    Controleer of de machine online is en of er iets op die poort luistert."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Dat tailnet is net verdwenen."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } wordt niet gerouteerd door { -app-name }: het eindigt niet op het domein van een tailnet dat nu routeert, dus het gaat rechtstreeks (via je normale netwerk en je eigen Tailscale).

# reference -app-name
Tailnet Link"""

