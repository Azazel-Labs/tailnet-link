source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Eén per regel: LOCALPORT = host:port, of auto = host:port om een vrije poort te laten kiezen. De naam van de host bepaalt welk tailnet het verkeer draagt. Snel een toevoegen? Gebruik de stekkerknop bij een machine in het tabblad Tailnets."

