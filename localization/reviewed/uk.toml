[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "«Увімкнено» задає налаштування проксі GNOME або KDE, поки застосунок працює й маршрутизує трафік, а потім повертає попереднє. У браузері Firefox увімкніть Налаштування > Параметри мережі > «Використовувати системні налаштування проксі»."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "«Увімкнено» задає проксі для ваших мережевих служб, поки застосунок працює, а потім повертає попередні налаштування. Якщо ваш Mac вимагає для цього пароль адміністратора, його буде запитано під час запуску маршрутизації та під час виходу."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "«Увімкнено» спрямовує Windows на правила цього застосунку лише тоді, коли він працює й маршрутизує трафік, і повертає все як було, коли він зупиняється, призупиняється, від’єднується або аварійно завершується."

