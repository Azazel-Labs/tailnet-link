[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "По одній на рядок: LOCALPORT = host:port або auto = host:port, щоб вільний порт було вибрано автоматично. Ім’я хоста визначає, через яку мережу tailnet піде трафік. Щоб швидко додати переадресацію, натисніть кнопку з вилкою біля пристрою на вкладці «Мережі tailnet»."

[messages.forwards-heading]
source = "Port forwards"
translation = "Переадресація портів"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Для застосунків, що ігнорують налаштування проксі, як-от віддалений робочий стіл, SSH і клієнти баз даних. Кожна переадресація — це порт на цьому комп’ютері, що веде до пристрою в мережі tailnet."

[messages.forwards-line-duplicate]
