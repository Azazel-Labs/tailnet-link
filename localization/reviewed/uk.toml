Не вдалося перенести ваші входи з tailnet-proxy, попередньої версії цього застосунку ({ $error }). Імовірно, він досі працює. Закрийте tailnet-proxy, а потім знову запустіть { -app-name }, перш ніж входити тут: повторний вхід додасть цей комп’ютер до кожної мережі tailnet удруге.

# reference -app-name
Tailnet Link"""

