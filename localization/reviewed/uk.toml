[messages.sign-in-dialog-text]
source = """
Your browser is opening Tailscale's sign-in page. It may open behind this window.
    
    Sign in with your account for that tailnet, then come back here. Its domain is picked up automatically."""
translation = """
Браузер відкриває сторінку входу Tailscale. Вона може з’явитися за цим вікном.
    
    Увійдіть в обліковий запис цієї мережі tailnet і поверніться сюди. Її домен визначиться автоматично."""

