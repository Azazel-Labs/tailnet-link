[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } маршрутизується через { $tailnet }, але підключитися до порту { $port } не вдалося: { $error }
    Переконайтеся, що пристрій онлайн і цей порт хтось прослуховує."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Ця мережа tailnet щойно зникла."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } не маршрутизує { $host }: адреса не закінчується доменом жодної з активних зараз мереж tailnet, тому йде напряму (через вашу звичайну мережу та ваш власний Tailscale).

# reference -app-name
Tailnet Link"""

