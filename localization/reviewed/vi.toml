[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } được định tuyến qua { $tailnet }, nhưng không thể kết nối tới cổng { $port }: { $error }
    Hãy kiểm tra xem máy có trực tuyến không và có dịch vụ nào đang lắng nghe trên cổng đó không."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Tailnet đó vừa biến mất."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ $host } không được { -app-name } định tuyến: nó không kết thúc bằng tên miền của tailnet nào đang định tuyến, nên sẽ đi trực tiếp (qua mạng thông thường và Tailscale của riêng bạn).

# reference -app-name
Tailnet Link"""

