translation = "Cài đặt proxy hệ thống"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "“Bật” thay đổi cài đặt proxy của GNOME hoặc KDE khi ứng dụng đang chạy và định tuyến, rồi khôi phục lại sau đó. Trong Firefox, hãy bật Cài đặt > Cài đặt mạng > “Sử dụng cài đặt proxy của hệ thống”."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "“Bật” đặt proxy cho các dịch vụ mạng của bạn khi ứng dụng đang chạy và khôi phục lại sau đó. Nếu máy Mac cần mật khẩu quản trị viên để làm việc này, bạn sẽ được hỏi khi bắt đầu định tuyến và khi thoát."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "“Bật” khiến Windows chỉ dùng quy tắc của ứng dụng này khi ứng dụng đang chạy và định tuyến, rồi khôi phục lại khi ứng dụng dừng, tạm dừng, ngắt kết nối hoặc gặp sự cố."

[messages.proxy-off]
