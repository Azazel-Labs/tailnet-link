Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Không thể chuyển các phiên đăng nhập của bạn từ tailnet-proxy, phiên bản trước của ứng dụng này ({ $error }). Có lẽ nó vẫn đang chạy. Hãy thoát tailnet-proxy, rồi khởi động lại { -app-name } trước khi đăng nhập ở đây: đăng nhập lại sẽ thêm máy tính này vào mỗi tailnet lần thứ hai.

# reference -app-name
Tailnet Link"""

