[messages.about-line]
source = """
{ -app-name } { $version } · local proxy { $proxy } · PAC { $pac }

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } { $version } · локални прокси { $proxy } · PAC { $pac }

# reference -app-name
Tailnet Link"""

[messages.add-forward]
source = "Add forward"
translation = "Додај прослеђивање"

[messages.add-forward-failed]
source = """
Couldn't add the port forward:
    { $error }"""
translation = """
Додавање прослеђивања порта није успело:
    { $error }"""

[messages.add-tailnet]
source = "Add a tailnet"
translation = "Додај мрежу tailnet"

[messages.add-tailnet-failed]
source = """
Couldn't add a tailnet:
    { $error }"""
translation = """
Додавање мреже tailnet није успело:
    { $error }"""

[messages.afrikaans]
source = "Afrikaans"
translation = "Африканс"

[messages.autostart-unsupported]
source = "Starting at login isn't supported on this system."
translation = "Покретање при пријављивању није подржано на овом систему."

[messages.cancel]
source = "Cancel"
translation = "Откажи"

[messages.catalan]
source = "Catalan"
translation = "Каталонски"

[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "{ $host } се налази у више мрежа tailnet ({ $tailnets }), па се не рутира. Уместо тога користите име уређаја или искључите подмреже за једну од тих мрежа."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: то није важећи порт."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Унесите име уређаја или веб адресу."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } се рутира преко { $tailnet }, али повезивање на порт { $port } није успело: { $error }
    Проверите да ли је уређај на мрежи и да ли нешто ослушкује тај порт."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Та мрежа tailnet је управо нестала."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } не рутира { $host }: то није име, адреса ни подмрежа ниједне мреже tailnet која тренутно рутира, па иде директно (кроз вашу уобичајену мрежу и ваш Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "Мрежа { $tailnet } није покренута."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } ради: повезано преко { $tailnet } за { $ms } мс."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "{ $host } се рутира преко { $tailnet }, али порт { $port } није одговорио у року од 10 секунди."

[messages.check-updates]
source = "Check for new versions"
translation = "Потражи нове верзије"

