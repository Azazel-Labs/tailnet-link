[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Ваше пријаве из tailnet-proxy, претходне верзије ове апликације, нису могле да се пренесу ({ $error }). Вероватно још увек ради. Изађите из tailnet-proxy, па поново покрените { -app-name } пре него што се пријавите овде: поновна пријава би додала овај рачунар у сваку мрежу tailnet други пут.

# reference -app-name
Tailnet Link"""

[messages.more-actions]
source = "More actions"
translation = "Још радњи"

[messages.names-format-help]
source = "One per line: name = address, for example wiki = 192.168.20.15. The address can be an IP address or a machine's name. Open it as http://wiki:8080/, with the port the website uses."
translation = "Једно по реду: name = address, на пример wiki = 192.168.20.15. Адреса може бити IP адреса или име уређаја. Отворите га као http://wiki:8080/, са портом који сајт користи."

[messages.names-heading]
source = "Names"
translation = "Имена"

[messages.names-help]
source = "Names of your own for addresses in your tailnets, such as a server behind a subnet router. They work in browsers and port forwards on this computer only."
translation = "Ваша сопствена имена за адресе у вашим мрежама tailnet, на пример за сервер иза рутера подмреже. Раде само у прегледачима и прослеђивањима портова на овом рачунару."

