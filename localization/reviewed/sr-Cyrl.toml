[messages.proxy-force]
source = "On, and replace a proxy script set by your company while running"
translation = "Укључено, уз замену прокси скрипте ваше компаније док апликација ради"

[messages.proxy-heading]
source = "System proxy setting"
translation = "Системско подешавање проксија"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "„Укључено“ подешава прокси у окружењу GNOME или KDE док апликација ради и рутира саобраћај, а после враћа претходно стање. У прегледачу Firefox укључите Подешавања > Подешавања мреже > „Користи системска подешавања проксија“."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "„Укључено“ подешава прокси за ваше мрежне услуге док апликација ради, а после враћа претходно стање. Ако ваш Mac за то тражи администраторску лозинку, биће затражена када рутирање почне и када изађете."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "„Укључено“ усмерава Windows на правила ове апликације само док ради и рутира саобраћај, а враћа претходно стање када се заустави, паузира, прекине везу или сруши."

[messages.proxy-off]
source = "Off: I'll set up my apps myself"
translation = "Искључено: подесићу апликације ручно"

[messages.proxy-on]
source = "On (recommended)"
translation = "Укључено (препоручено)"

[messages.proxy-replace]
source = "Replace it"
translation = "Замени је"

[messages.proxy-replace-tooltip]
source = """
Use { -app-name }'s setup script while it runs, and put the other one back afterwards

# reference -app-name
Tailnet Link"""
translation = """
Користи скрипту за подешавање апликације { -app-name } док ради, а после врати ону другу

# reference -app-name
Tailnet Link"""

[messages.proxy-retry]
source = "Try again"
translation = "Покушај поново"

[messages.proxy-retry-tooltip]
source = """
Point the system proxy setting at { -app-name } again

# reference -app-name
Tailnet Link"""
translation = """
Поново усмери системско подешавање проксија на { -app-name }

# reference -app-name
Tailnet Link"""

