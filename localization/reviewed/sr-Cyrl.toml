[messages.forward-dialog-text]
source = "Get a port on this computer that leads to { $host }. Which port on that machine?"
translation = "Добијте порт на овом рачунару који води до { $host }. Који порт на том уређају?"

[messages.forward-dialog-title]
source = "Forward a port"
translation = "Прослеђивање порта"

[messages.forward-no-tailnet]
source = "No routing tailnet has this name"
translation = "Ниједна активна мрежа tailnet нема ово име"

[messages.forward-port-on-save]
source = "A port is picked when you save"
translation = "Порт се бира када сачувате"

[messages.forward-port-tooltip]
source = "Forward a port: for apps that ignore the proxy setting, like Remote Desktop or a database client"
translation = "Проследи порт: за апликације које занемарују подешавање проксија, као што су Удаљена радна површина или клијент базе података"

[messages.forward-ready-note]
source = "The port stays the same. You'll find it in Settings."
translation = "Порт остаје исти. Наћи ћете га у Подешавањима."

[messages.forward-ready-text]
source = "Point your app at this address to reach { $target }:"
translation = "Усмерите апликацију на ову адресу да бисте стигли до { $target }:"

[messages.forward-ready-title]
source = "Port forward ready"
translation = "Прослеђивање порта је спремно"

[messages.forward-via]
source = "via { $tailnet }"
translation = "преко { $tailnet }"

[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "Једно по реду: LOCALPORT = host:port, или auto = host:port да би се изабрао слободан порт. Име хоста одређује која мрежа tailnet преноси саобраћај. За брзо додавање користите дугме са утикачем поред уређаја на картици „Мреже tailnet“."

[messages.forwards-heading]
source = "Port forwards"
translation = "Прослеђивање портова"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "За апликације које занемарују подешавање проксија, као што су Удаљена радна површина, SSH и клијенти база података. Свако прослеђивање је порт на овом рачунару који води до уређаја у мрежи tailnet."

[messages.forwards-line-duplicate]
source = "Line { $line }: local port { $port } is used twice."
translation = "Ред { $line }: локални порт { $port } је наведен двапут."

[messages.forwards-line-format]
source = "Line { $line }: write LOCALPORT = host:port."
translation = "Ред { $line }: упишите LOCALPORT = host:port."

[messages.forwards-line-port]
source = "Line { $line }: “{ $value }” isn't a port number (or auto)."
translation = "Ред { $line }: „{ $value }“ није број порта (нити auto)."

[messages.forwards-line-target]
source = "Line { $line }: “{ $value }” should be host:port."
translation = "Ред { $line }: „{ $value }“ треба да буде у облику host:port."

