[messages.check-gone]
source = "That tailnet just went away."
translation = "Tato síť tailnet právě zmizela."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } nesměruje { $host }: adresa nekončí doménou žádné sítě tailnet, která právě směruje, takže jde napřímo (přes vaši běžnou síť a váš vlastní Tailscale).

