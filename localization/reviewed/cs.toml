[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Vaše přihlášení z tailnet-proxy, dřívější verze této aplikace, se nepodařilo přenést ({ $error }). Pravděpodobně stále běží. Ukončete tailnet-proxy a pak znovu spusťte { -app-name }, než se tady přihlásíte: nové přihlášení by tento počítač přidalo do každé sítě tailnet podruhé.

# reference -app-name
Tailnet Link"""

