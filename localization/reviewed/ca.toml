[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
No s’han pogut traslladar les sessions iniciades a tailnet-proxy, la versió anterior d’aquesta aplicació ({ $error }). Probablement encara s’està executant. Surt de tailnet-proxy i torna a iniciar { -app-name } abans d’iniciar la sessió aquí: tornar a iniciar la sessió afegiria aquest ordinador a cada tailnet per segona vegada.

# reference -app-name
Tailnet Link"""

