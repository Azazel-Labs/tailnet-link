[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "«Activat» configura el proxy de GNOME o KDE mentre l’aplicació s’executa i encamina, i el restaura després. Al Firefox, activa Paràmetres > Paràmetres de xarxa > «Utilitza la configuració del servidor intermediari del sistema»."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "«Activat» configura el proxy dels serveis de xarxa mentre l’aplicació s’executa i el restaura després. Si el Mac demana una contrasenya d’administrador per fer-ho, se’t demanarà quan comenci l’encaminament i quan surtis."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "«Activat» fa que Windows utilitzi les regles d’aquesta aplicació només mentre s’executa i encamina, i ho restaura tot quan s’atura, es posa en pausa, es desconnecta o falla."

