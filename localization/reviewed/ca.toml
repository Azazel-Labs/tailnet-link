translation = "Escriu el nom d’una màquina o una adreça web."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } s’encamina per { $tailnet }, però la connexió al port { $port } ha fallat: { $error }
    Comprova que la màquina estigui en línia i que hi hagi alguna cosa escoltant en aquest port."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Aquesta tailnet acaba de desaparèixer."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } no encamina { $host }: no acaba amb el domini de cap tailnet que encamini ara mateix, de manera que va directe (per la teva xarxa normal i el teu propi Tailscale).

# reference -app-name
Tailnet Link"""

