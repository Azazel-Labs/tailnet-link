[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Ara mateix no passa res per les altres tailnets. La teva xarxa i la teva tailnet funcionen com sempre."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "El navegador no obrirà les adreces d’aquestes tailnets: alguna altra cosa ha canviat la configuració del proxy del sistema."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "El navegador no obrirà les adreces d’aquestes tailnets: no s’ha pogut canviar la configuració del proxy del sistema ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "La configuració del proxy del sistema està desactivada, de manera que només les aplicacions que configuris tu mateix arriben a aquestes tailnets. Fes que apuntin a { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
El navegador no obrirà les adreces d’aquestes tailnets: una altra còpia de { -app-name } té la configuració del proxy del sistema. Surt d’aquella còpia i aquesta en prendrà el control.

# reference -app-name
Tailnet Link"""

