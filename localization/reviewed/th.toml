translation = "เปิด และแทนที่สคริปต์พร็อกซีที่บริษัทของคุณตั้งไว้ขณะทำงาน"

[messages.proxy-heading]
source = "System proxy setting"
translation = "การตั้งค่าพร็อกซีของระบบ"

[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = '"เปิด" จะตั้งค่าพร็อกซีของ GNOME หรือ KDE ขณะที่แอปทำงานและกำหนดเส้นทางอยู่ และคืนค่าเดิมหลังจากนั้น ใน Firefox ให้เปิด การตั้งค่า > การตั้งค่าเครือข่าย > "ใช้การตั้งค่าพร็อกซีของระบบ"'

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = '"เปิด" จะตั้งค่าพร็อกซีสำหรับบริการเครือข่ายของคุณขณะที่แอปทำงาน และคืนค่าเดิมหลังจากนั้น หาก Mac ของคุณต้องใช้รหัสผ่านผู้ดูแลระบบในการนี้ ระบบจะขอเมื่อเริ่มกำหนดเส้นทางและเมื่อคุณออกจากแอป'

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = '"เปิด" จะชี้ Windows ไปยังกฎของแอปนี้เฉพาะขณะที่แอปทำงานและกำหนดเส้นทางอยู่ และจะคืนค่าเดิมเมื่อแอปหยุด หยุดชั่วคราว ตัดการเชื่อมต่อ หรือขัดข้อง'

