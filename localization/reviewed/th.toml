[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
ย้ายการลงชื่อเข้าใช้ของคุณจาก tailnet-proxy ซึ่งเป็นแอปนี้เวอร์ชันก่อนหน้าไม่ได้ ({ $error }) อาจเป็นเพราะ tailnet-proxy ยังทำงานอยู่ ให้ออกจาก tailnet-proxy แล้วเริ่ม { -app-name } ใหม่ก่อนลงชื่อเข้าใช้ที่นี่ เพราะการลงชื่อเข้าใช้อีกครั้งจะเพิ่มคอมพิวเตอร์เครื่องนี้ลงในแต่ละ tailnet เป็นครั้งที่สอง

