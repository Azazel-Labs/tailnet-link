[messages.hero-connecting]
source = "Connecting to your tailnets."
translation = "กำลังเชื่อมต่อกับ tailnet ของคุณ"

[messages.hero-finish-sign-in]
source = "Finish signing in to { $tailnet } in your browser."
translation = "ลงชื่อเข้าใช้ { $tailnet } ในเบราว์เซอร์ให้เสร็จ"

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "ขณะนี้ไม่มีข้อมูลใดผ่าน tailnet อื่น เครือข่ายและ tailnet ของคุณเองยังทำงานตามปกติ"

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "เบราว์เซอร์จะไม่เปิดที่อยู่ของ tailnet เหล่านี้: มีสิ่งอื่นเปลี่ยนการตั้งค่าพร็อกซีของระบบ"

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "เบราว์เซอร์จะไม่เปิดที่อยู่ของ tailnet เหล่านี้: เปลี่ยนการตั้งค่าพร็อกซีของระบบไม่ได้ ({ $error })"

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "การตั้งค่าพร็อกซีของระบบปิดอยู่ จึงมีเพียงแอปที่คุณตั้งค่าเองเท่านั้นที่เข้าถึง tailnet เหล่านี้ได้ ให้ชี้แอปเหล่านั้นไปที่ { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
เบราว์เซอร์จะไม่เปิดที่อยู่ของ tailnet เหล่านี้: { -app-name } อีกตัวหนึ่งครองการตั้งค่าพร็อกซีของระบบอยู่ ปิดตัวนั้นแล้วตัวนี้จะทำหน้าที่แทน

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
source = "Your browser won't open these tailnets' addresses: the system proxy setting uses another setup script ({ $script })."
translation = "เบราว์เซอร์จะไม่เปิดที่อยู่ของ tailnet เหล่านี้: การตั้งค่าพร็อกซีของระบบใช้สคริปต์การตั้งค่าอื่นอยู่ ({ $script })"

[messages.hero-routing]
source = "Addresses in these tailnets open in your browser. Everything else goes direct."
translation = "ที่อยู่ใน tailnet เหล่านี้เปิดได้ในเบราว์เซอร์ ส่วนการเชื่อมต่ออื่นทั้งหมดจะไปโดยตรง"

[messages.hero-routing-example]
source = "Open { $address } or any other address in these tailnets. Everything else goes direct."
translation = "เปิด { $address } หรือที่อยู่อื่นใดใน tailnet เหล่านี้ได้ ส่วนการเชื่อมต่ออื่นทั้งหมดจะไปโดยตรง"

[messages.hero-sign-in]
source = "Sign in to { $tailnet } to reach its machines."
translation = "ลงชื่อเข้าใช้ { $tailnet } เพื่อเข้าถึงเครื่องในนั้น"

