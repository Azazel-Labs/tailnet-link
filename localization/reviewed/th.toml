[messages.about-line]
source = """
{ -app-name } { $version } · local proxy { $proxy } · PAC { $pac }

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } { $version } · พร็อกซีในเครื่อง { $proxy } · PAC { $pac }

# reference -app-name
Tailnet Link"""

