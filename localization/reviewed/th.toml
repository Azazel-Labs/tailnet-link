translation = "จะเลือกพอร์ตเมื่อคุณบันทึก"

[messages.forward-port-tooltip]
source = "Forward a port: for apps that ignore the proxy setting, like Remote Desktop or a database client"
translation = "ส่งต่อพอร์ต: สำหรับแอปที่ไม่ทำตามการตั้งค่าพร็อกซี เช่น เดสก์ท็อประยะไกลหรือไคลเอ็นต์ฐานข้อมูล"

[messages.forward-ready-note]
source = "The port stays the same. You'll find it in Settings."
translation = "พอร์ตจะคงเดิม คุณดูได้ในการตั้งค่า"

[messages.forward-ready-text]
source = "Point your app at this address to reach { $target }:"
translation = "ตั้งค่าแอปของคุณให้ใช้ที่อยู่นี้เพื่อเข้าถึง { $target }:"

[messages.forward-ready-title]
source = "Port forward ready"
translation = "การส่งต่อพอร์ตพร้อมแล้ว"

[messages.forward-via]
source = "via { $tailnet }"
translation = "ผ่าน { $tailnet }"

[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "บรรทัดละหนึ่งรายการ: LOCALPORT = host:port หรือ auto = host:port เพื่อให้เลือกพอร์ตว่างให้ ชื่อโฮสต์เป็นตัวกำหนดว่า tailnet ใดรับส่งข้อมูล หากต้องการเพิ่มอย่างรวดเร็ว ให้ใช้ปุ่มปลั๊กที่เครื่องในแท็บ Tailnet"

[messages.forwards-heading]
source = "Port forwards"
translation = "การส่งต่อพอร์ต"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "สำหรับแอปที่ไม่ทำตามการตั้งค่าพร็อกซี เช่น เดสก์ท็อประยะไกล SSH และไคลเอ็นต์ฐานข้อมูล การส่งต่อแต่ละรายการคือพอร์ตบนคอมพิวเตอร์เครื่องนี้ที่นำไปยังเครื่องใน tailnet"

[messages.forwards-line-duplicate]
source = "Line { $line }: local port { $port } is used twice."
translation = "บรรทัด { $line }: พอร์ตในเครื่อง { $port } ถูกใช้สองครั้ง"

[messages.forwards-line-format]
source = "Line { $line }: write LOCALPORT = host:port."
translation = "บรรทัด { $line }: เขียนเป็น LOCALPORT = host:port"

[messages.forwards-line-port]
source = "Line { $line }: “{ $value }” isn't a port number (or auto)."
translation = 'บรรทัด { $line }: "{ $value }" ไม่ใช่หมายเลขพอร์ต (หรือ auto)'

[messages.forwards-line-target]
source = "Line { $line }: “{ $value }” should be host:port."
translation = 'บรรทัด { $line }: "{ $value }" ควรเป็น host:port'

