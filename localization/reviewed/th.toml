source = "Get a port on this computer that leads to { $host }. Which port on that machine?"
translation = "รับพอร์ตบนคอมพิวเตอร์เครื่องนี้ที่นำไปยัง { $host } จะใช้พอร์ตใดบนเครื่องนั้น"

