[messages.migrate-failed]
source = """
Your sign-ins from tailnet-proxy, this app's earlier version, couldn't be moved over ({ $error }). It's probably still running. Quit tailnet-proxy, then start { -app-name } again before you sign in here: signing in again would add this computer to each tailnet a second time.

# reference -app-name
Tailnet Link"""
translation = """
Не удалось перенести ваши входы из tailnet-proxy, предыдущей версии этого приложения ({ $error }). Вероятно, оно всё ещё работает. Закройте tailnet-proxy, а затем снова запустите { -app-name }, прежде чем входить здесь: повторный вход добавит этот компьютер в каждую сеть tailnet во второй раз.

# reference -app-name
Tailnet Link"""

