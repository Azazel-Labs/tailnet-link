[messages.check-ambiguous]
source = "{ $host } is in more than one tailnet ({ $tailnets }), so it isn't routed. Use the machine's name instead, or turn off subnets for one of those tailnets."
translation = "{ $host } входит в несколько сетей tailnet ({ $tailnets }), поэтому не маршрутизируется. Используйте вместо этого имя устройства или отключите подсети в одной из этих сетей."

[messages.check-bad-port]
source = "{ $input }: that's not a valid port."
translation = "{ $input }: недопустимый порт."

[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Введите имя устройства или веб-адрес."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } маршрутизируется через { $tailnet }, но подключиться к порту { $port } не удалось: { $error }
    Убедитесь, что устройство онлайн и этот порт кто-то прослушивает."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Эта сеть tailnet только что исчезла."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it isn't a name, address or subnet of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } не маршрутизирует { $host }: это не имя, не адрес и не подсеть ни одной из активных сейчас сетей tailnet, поэтому трафик идёт напрямую (через вашу обычную сеть и ваш собственный Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "Сеть { $tailnet } не запущена."

[messages.check-ok]
