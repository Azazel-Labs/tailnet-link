[messages.forward-via]
source = "via { $tailnet }"
translation = "через { $tailnet }"

[messages.forwards-format-help]
source = "One per line: LOCALPORT = host:port, or auto = host:port to have a free port picked. The host's name decides which tailnet carries it. To add one quickly, use the plug button on a machine in the Tailnets tab."
translation = "По одной на строку: LOCALPORT = host:port или auto = host:port, чтобы свободный порт выбрался автоматически. Имя хоста определяет, через какую сеть tailnet пойдёт трафик. Чтобы быстро добавить переадресацию, нажмите кнопку с вилкой у устройства на вкладке «Сети tailnet»."

[messages.forwards-heading]
source = "Port forwards"
translation = "Переадресация портов"

[messages.forwards-help]
source = "For apps that ignore the proxy setting, like Remote Desktop, SSH and database clients. Each forward is a port on this computer that leads to a machine in a tailnet."
translation = "Для приложений, игнорирующих настройку прокси, например удалённого рабочего стола, SSH и клиентов баз данных. Каждая переадресация — это порт на этом компьютере, ведущий к устройству в сети tailnet."

[messages.forwards-line-duplicate]
source = "Line { $line }: local port { $port } is used twice."
translation = "Строка { $line }: локальный порт { $port } указан дважды."

[messages.forwards-line-format]
source = "Line { $line }: write LOCALPORT = host:port."
translation = "Строка { $line }: используйте формат LOCALPORT = host:port."

