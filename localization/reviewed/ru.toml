source = "Finish signing in to { $tailnet } in your browser."
translation = "Завершите вход в { $tailnet } в браузере."

[messages.hero-paused]
source = "Nothing goes through other tailnets right now. Your own network and tailnet work as usual."
translation = "Сейчас через другие сети tailnet ничего не идёт. Ваша локальная сеть и собственная сеть tailnet работают как обычно."

[messages.hero-proxy-changed]
source = "Your browser won't open these tailnets' addresses: something else changed the system proxy setting."
translation = "Браузер не откроет адреса этих сетей tailnet: что-то другое изменило системную настройку прокси."

[messages.hero-proxy-failed]
source = "Your browser won't open these tailnets' addresses: the system proxy setting couldn't be changed ({ $error })."
translation = "Браузер не откроет адреса этих сетей tailnet: не удалось изменить системную настройку прокси ({ $error })."

[messages.hero-proxy-manual]
source = "The system proxy setting is off, so only apps you set up yourself reach these tailnets. Point them at { $pac }"
translation = "Системная настройка прокси выключена, поэтому в эти сети tailnet попадают только приложения, которые вы настроили сами. Укажите в них { $pac }"

[messages.hero-proxy-other-copy]
source = """
Your browser won't open these tailnets' addresses: another copy of { -app-name } has the system proxy setting. Quit that copy, and this one takes over.

# reference -app-name
Tailnet Link"""
translation = """
Браузер не откроет адреса этих сетей tailnet: системную настройку прокси заняла другая копия { -app-name }. Закройте ту копию, и эта возьмёт настройку на себя.

# reference -app-name
Tailnet Link"""

[messages.hero-proxy-taken]
