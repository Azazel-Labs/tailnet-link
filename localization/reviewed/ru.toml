[messages.check-empty]
source = "Type a machine name or a web address."
translation = "Введите имя устройства или веб-адрес."

[messages.check-failed]
source = """
{ $host } is routed through { $tailnet }, but connecting to port { $port } failed: { $error }
    Check the machine is online and something is listening on that port."""
translation = """
{ $host } маршрутизируется через { $tailnet }, но подключиться к порту { $port } не удалось: { $error }
    Убедитесь, что устройство онлайн и этот порт кто-то прослушивает."""

[messages.check-gone]
source = "That tailnet just went away."
translation = "Эта сеть tailnet только что исчезла."

[messages.check-not-routed]
source = """
{ $host } isn't routed by { -app-name }: it doesn't end in the domain of any tailnet that's routing right now, so it goes direct (through your normal network and your own Tailscale).

# reference -app-name
Tailnet Link"""
translation = """
{ -app-name } не маршрутизирует { $host }: адрес не оканчивается доменом ни одной из активных сейчас сетей tailnet, поэтому идёт напрямую (через вашу обычную сеть и ваш собственный Tailscale).

# reference -app-name
Tailnet Link"""

[messages.check-not-running]
source = "{ $tailnet } isn't running."
translation = "Сеть { $tailnet } не запущена."

[messages.check-ok]
source = "{ $address } works: connected through { $tailnet } in { $ms } ms."
translation = "{ $address } работает: подключение через { $tailnet } за { $ms } мс."

[messages.check-timeout]
source = "{ $host } is routed through { $tailnet }, but port { $port } didn't answer within 10 seconds."
translation = "{ $host } маршрутизируется через { $tailnet }, но порт { $port } не ответил за 10 секунд."

