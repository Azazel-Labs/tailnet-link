[messages.proxy-help-linux]
source = '"On" sets the GNOME or KDE proxy setting while the app is running and routing, and puts it back afterwards. In Firefox, turn on Settings > Network Settings > "Use system proxy settings".'
translation = "«Вкл.» задаёт настройку прокси GNOME или KDE, пока приложение работает и маршрутизирует трафик, а затем возвращает прежнюю. В браузере Firefox включите Настройки > Параметры сети > «Использовать системные настройки прокси»."

[messages.proxy-help-macos]
source = """"On" sets the proxy for your network services while the app is running and puts it back afterwards. If your Mac needs an admin password for that, you'll be asked when routing starts and when you quit."""
translation = "«Вкл.» задаёт прокси для ваших сетевых служб, пока приложение работает, а затем возвращает прежние настройки. Если для этого Mac требует пароль администратора, он будет запрошен при запуске маршрутизации и при выходе."

[messages.proxy-help-windows]
source = """"On" points Windows at this app's rules only while it's running and routing, and puts things back when it stops, pauses, disconnects or crashes."""
translation = "«Вкл.» направляет Windows на правила этого приложения, только пока оно работает и маршрутизирует трафик, и возвращает всё как было, когда оно останавливается, приостанавливается, отключается или аварийно завершается."

