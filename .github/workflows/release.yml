name: Release

# A version tag (v1.2.3, or v1.2.3-rc.1 for a prerelease) runs CI, builds the
# installers for every platform and publishes a GitHub Release with them.
# Tags come from `cargo xtask release publish`, which starts this, or the Auto
# release workflow, which calls it with the tag it made.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to release (Auto release passes the one it made)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.tag || github.ref_name }}
  # Build dependencies on Linux: GTK + AppIndicator (tray), xdo, xkbcommon, Wayland.
  LINUX_DEPS: build-essential libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev

jobs:
  plan:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - name: Check this is a version tag
        run: |
          if [[ "$VERSION" != v* ]]; then
            echo "::error::Run releases from a version tag (v1.2.3)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      # The tag's commit must already carry its version in Cargo.toml and Cargo.lock.
      - name: Validate version tag
        run: cargo xtask release validate "$VERSION"
      - id: decide
        run: |
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: plan
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows installer
    needs: checks
    runs-on: ubuntu-latest # cross-compiles with MinGW; NSIS builds the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-pc-windows-gnu
      - name: Install NSIS and MinGW
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis gcc-mingw-w64-x86-64
      - name: Build exe + installer
        run: bash packaging/windows/build-installer.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-link-windows
          path: |
            dist/tailnet-link-windows-setup.exe
            dist/tailnet-link-windows-amd64.exe
          if-no-files-found: error

  linux:
    name: Linux package
    needs: checks
    runs-on: ubuntu-24.04 # fixed glibc baseline for the download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-release
      - name: Install Linux build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q $LINUX_DEPS
      - name: Build .deb
        run: bash packaging/linux/package-deb.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-link-linux
          path: dist/tailnet-link-linux-*
          if-no-files-found: error

  macos:
    name: macOS app
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-universal
      - name: Build universal .app (.dmg + .zip)
        run: bash packaging/macos/package-macos.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailnet-link-macos
          path: |
            dist/tailnet-link-macos-universal.dmg
            dist/tailnet-link-macos-universal.zip
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    needs: [plan, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.VERSION }}
          name: Tailnet Link ${{ env.VERSION }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease != 'true' }}
          generate_release_notes: true
          body: "**Windows:** `tailnet-link-windows-setup.exe` · **macOS:** `tailnet-link-macos-universal.dmg` · **Linux:** `tailnet-link-linux-amd64.deb`. Unsigned; see the README for first-run notes on macOS and Windows."
          files: dist/*
          fail_on_unmatched_files: true
